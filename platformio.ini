; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
; platform 이 고정돼 있지 않으면 빌드할 때마다 Arduino 코어가 바뀔 수 있다.
; 2026-09-14 로그의 Wire.cpp:499 는 2.0.17(해당 로그가 360행)이 아니었다.
; 통신이 되던 시점과 코어가 달라졌는지 보려면 아래 줄을 바꿔가며 재현할 것.
platform = espressif32
; platform = espressif32@6.11.0   ; Arduino core 2.0.17
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -Wall -Wextra
