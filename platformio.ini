; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html
;
; ---------------------------------------------------------------------------
; 환경 세 개가 같은 lib/ 드라이버와 플랫폼 계층을 공유하고, src/ 의 최상위
; 스케치만 바꿔 끼운다.
;
;   esp32doit-devkit-v1   src/main.cpp        기존 진단 벤치 (기본)
;   diag                  src/diag_laser.cpp  레이저 미점등 진단. 읽기 전용
;   ranging8x8            src/ranging_8x8.cpp 8x8 depth 스트리밍 (binning 12)
;
; 빌드 / 업로드:
;   pio run                         (기본 env 만)
;   pio run -e diag -t upload
;   pio run -e ranging8x8 -t upload
;   pio run -t clean -e <env>
; ---------------------------------------------------------------------------

[platformio]
default_envs = esp32doit-devkit-v1

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -Wall

[env:esp32doit-devkit-v1]
build_src_filter = +<*> -<diag_laser.cpp> -<ranging_8x8.cpp>

[env:diag]
build_src_filter = +<vl53l9_platform_esp32.cpp> +<diag_laser.cpp>

[env:ranging8x8]
build_src_filter = +<vl53l9_platform_esp32.cpp> +<ranging_8x8.cpp>
